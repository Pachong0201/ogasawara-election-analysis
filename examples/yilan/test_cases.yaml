version: 1.0.0
name: yilan_v1_acceptance_tests
description: >
  宜兰试点验收测试。只定义输入、必做步骤与通过标准，不提供
  未核实的真实选举数据，也不构成 Skill 运行依赖。

tests:
  - id: TEST-A
    name: 跨层级选举矩阵发现地方全国差异
    input: 为什么宜兰县长选举与总统选举票型差异很大？
    required_actions:
      - 读取至少三届县长选举与至少三届总统选举。
      - 建立乡镇市区层级的跨层级矩阵。
      - 比较县市长票、总统票、区域立委票与必要的政党票。
      - 识别 Local-National Gap。
      - 不以最新民调作为主要证据。
    pass_criteria:
      - 必须比较多届选举，而非只引用当前民调。
      - 必须区分全县市共同变化与地方特有变化。
      - 必须列出至少 3 个关键乡镇市区或说明为何资料不足以列出。
      - 必须说明地方／全国差异的可能机制与验证状态。
    fail_if:
      - 只引用单一届选举。
      - 以总统票直接当作县市长基本盘。
      - 直接给出胜负预测。

  - id: TEST-B
    name: 历史派系资料时间有效性
    input: 1996 年的研究说某地方由某派系控制，现在是不是还是？
    required_actions:
      - 读取历史资料的 time_scope。
      - 检查该派系、人物或组织近 5—10 年公开活动。
      - 寻找当前公职、选举、组织职位或公开支持纪录。
      - 检查是否存在相反证据、分裂或转型。
    pass_criteria:
      - 必须拒绝直接把历史关系外推到当前。
      - 必须要求当前资料重新验证。
      - 必须使用 historical_only、active_verified、disputed 或 unknown 等状态。
    fail_if:
      - 写成该派系目前仍主导当地政治。
      - 仅凭历史文献形成当前结构性判断。
      - 仅凭农渔会或社团名称推断支持关系。

  - id: TEST-C
    name: 数字异常触发地方知识检索
    input: A 乡和旁边 B 乡人口结构差不多，但一个候选人差 20 个百分点，为什么？
    required_actions:
      - 先检查行政区划、投票率、候选人数量与有效票结构是否可比。
      - 计算空间残差或相邻差异。
      - 标记 local_explanation_required=true。
      - 依序检索候选人、基层政治、地方组织、历史研究与当前验证。
      - 不先假设派系、买票或个人魅力。
    pass_criteria:
      - 先标记空间异常，再触发地方知识检索。
      - 不得直接归因派系。
      - 必须说明查到什么、还缺什么。
      - 证据不足时输出 unknown。
    fail_if:
      - 直接写“因为某派系”。
      - 根据异常票型推断买票或违法行为。
      - 把高空间离散直接解释成组织票。

  - id: CASE-1
    input: 为什么宜兰县长选举与总统选举票型差异很大？
    reference_test: TEST-A
    pass_criteria:
      - 必须比较多届选举，而非只引用当前民调。

  - id: CASE-2
    input: >
      2022 某候选人县长拿 55%，2024 本党总统只有 33%，
      是不是说明他有 22% 个人票？
    required_actions:
      - 记录 baseline_method。
      - 计算候选人对政党基准的残差。
      - 区分统计残差与个人票。
    pass_criteria:
      - 必须回答：22 个百分点是候选人相对政党基准的残差，不能直接认定全部属于个人票。
      - 必须要求进一步验证地方组织、跨党支持、对手结构与第三势力票流动。
    fail_if:
      - 直接称 22 个百分点为个人票。
      - 据此形成候选人评分或胜负判断。

  - id: CASE-3
    input: 2024 蓝 35%、白 25%，是不是蓝白合作就有 60%？
    required_actions:
      - 拒绝机械加总。
      - 检查第三势力票来源、正式合作范围、地方组织接受度、候选人跨党接受度与支持者交叉表。
      - 分析第三势力票空间分布。
    pass_criteria:
      - 必须拒绝机械加总。
      - 必须分析第三势力票来源与合作转移问题。
      - 不得直接写第三势力票将转给某方。
    fail_if:
      - 直接以 35% + 25% = 60% 作为县市长票或合作结果。
      - 将算术合计写成必然转移。

  - id: CASE-4
    input: A 乡和旁边 B 乡人口结构差不多，但一个候选人差 20 个百分点，为什么？
    reference_test: TEST-C
    pass_criteria:
      - 先标记空间异常，再触发地方知识检索，不得直接归因派系。

  - id: CASE-5
    input: 5 月电话民调 A 35%，8 月网络民调 A 42%，是不是上涨 7 个百分点？
    required_actions:
      - 检查 pollster、commissioner、method、sample_size、sample_frame、field_start、field_end、moe、moe_applicable、undecided。
      - 区分电话调查与网络调查。
    pass_criteria:
      - 不得直接计算趋势。
      - 必须说明调查方式、机构、题目与样本差异。
      - 必须并列呈现，不能写成上涨或下降。
    fail_if:
      - 直接以 42% - 35% = 7 个百分点作为趋势。
      - 把不同机构或不同调查方式连成趋势线。

  - id: CASE-6
    input: 1996 年的研究说某地方由某派系控制，现在是不是还是？
    reference_test: TEST-B
    pass_criteria:
      - 必须检查时间有效性，要求当前资料重新验证。
