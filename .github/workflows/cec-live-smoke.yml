name: CEC live smoke

on:
  push:
    branches: [main]
    paths:
      - "runtime/cec_open_data.py"
      - "runtime/source_registry.py"
      - "runtime/election_loader.py"
      - "config/data_sources.yaml"
      - ".github/workflows/cec-live-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  official-cec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and parse official CEC archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from runtime.cec_open_data import CECOpenDataAdapter
          from runtime.cec_current_candidates import CECCurrentCandidateAdapter
          from runtime.models import DataQuery, ElectionTask
          from runtime.pipeline import AnalysisPipeline

          adapter = CECOpenDataAdapter(cache_dir=Path("cache/raw/cec"))

          checks = [
              DataQuery("county_mayor", 2014, "宜兰县", "township_district"),
              DataQuery("county_mayor", 2018, "宜兰县", "township_district"),
              DataQuery("county_mayor", 2022, "宜兰县", "township_district"),
              DataQuery("president", 2016, "宜兰县", "township_district"),
              DataQuery("president", 2020, "宜兰县", "township_district"),
              DataQuery("president", 2024, "宜兰县", "township_district"),
              DataQuery("regional_legislator", 2016, "宜兰县", "township_district"),
              DataQuery("regional_legislator", 2020, "宜兰县", "township_district"),
              DataQuery("regional_legislator", 2024, "宜兰县", "township_district"),
          ]

          for query in checks:
              result = adapter.fetch(query)
              assert result.source_id == "cec_open_data", result
              assert result.source_grade == "A", result
              assert result.records, (query, result.warnings)
              regions = {row["jurisdiction"] for row in result.records}
              assert len(regions) >= 10, (query, len(regions), sorted(regions), result.warnings)
              assert all(row["votes"] >= 0 for row in result.records)
              assert all(0 <= row["vote_share"] <= 1 for row in result.records)
              assert all(0 <= row["turnout"] <= 1 for row in result.records)
              print(query.to_dict(), "records=", len(result.records), "regions=", len(regions))
              print("source_version=", result.source_version)

          candidate_adapter = CECCurrentCandidateAdapter()
          candidates = candidate_adapter.fetch("宜兰县", "county_mayor", 2026)
          assert candidates.records, candidates.warnings
          assert all(row["candidate_status"] == "registered" for row in candidates.records)
          assert all(row["source_grade"] == "A" for row in candidates.records)
          print("current_candidates=", len(candidates.records))
          print("candidate_names=", sorted(row["name"] for row in candidates.records))

          # End-to-end: empty runtime root must be able to prepare all historical
          # periods + official current candidates and pass the hard readiness gate.
          with TemporaryDirectory() as tmp:
              pipeline = AnalysisPipeline(Path(tmp), mode="online")
              context = pipeline.run(
                  ElectionTask(
                      election_type="county_mayor",
                      target_year=2026,
                      jurisdiction="宜兰县",
                      analysis_level="township_district",
                  ),
                  allow_online=True,
              )
              readiness = context.analysis_context["readiness"]
              assert readiness["status"] == "READY", readiness
              assert readiness["required"]["historical_same_type"]["found_count"] == 3
              assert readiness["required"]["presidential"]["found_count"] == 3
              assert readiness["required"]["regional_legislator"]["found_count"] == 3
              assert readiness["required"]["current_candidate_list"]["registered_count"] >= 1
              print("pipeline_readiness=", readiness["status"])
              print("pipeline_candidates=", readiness["required"]["current_candidate_list"]["registered_count"])
          PY
