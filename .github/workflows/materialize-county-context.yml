name: Materialize official county context

on:
  workflow_dispatch:
  push:
    branches:
      - feature/feishu-election-bot-v1.4-integration
    paths:
      - ".github/workflows/materialize-county-context.yml"
      - "runtime/context_official_download.py"
      - "runtime/county_context_catalog.py"
      - "config/county_context_sources.yaml"

permissions:
  contents: write

concurrency:
  group: materialize-county-context
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/feishu-election-bot-v1.4-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and import official county-context resources
        run: |
          python -m runtime.context_official_download --force --allow-partial

      - name: Rebuild knowledge coverage manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from runtime.knowledge_coverage import KnowledgeCoverageAudit

          root = Path(".").resolve()
          report = KnowledgeCoverageAudit(root).build()
          path = root / "data" / "manifests" / "knowledge_coverage_latest.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["summary"], ensure_ascii=False, indent=2))
          PY

      - name: Commit verified normalized context data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context data/manifests
          if git diff --cached --quiet; then
            echo "No normalized county-context changes to commit."
            exit 0
          fi
          git commit -m "data: materialize verified official county context"
          git pull --rebase origin feature/feishu-election-bot-v1.4-integration
          git push origin HEAD:feature/feishu-election-bot-v1.4-integration

      - name: Report remaining context-source failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/manifests/context_materialization_latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("CONTEXT_SUCCESS=", report.get("success_count"))
          print("CONTEXT_FAILURE=", report.get("failure_count"))
          for failure in report.get("failures") or []:
              print(failure.get("source_id"), failure.get("error"))
          if int(report.get("failure_count") or 0):
              raise SystemExit("official context materialization still has source failures")
          PY
