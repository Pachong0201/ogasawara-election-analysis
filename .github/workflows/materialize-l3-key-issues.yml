name: Research and materialize L3 county key issues

on:
  workflow_dispatch:
  push:
    branches:
      - feature/feishu-election-bot-v1.4-integration
    paths:
      - ".github/workflows/materialize-l3-key-issues.yml"
      - "runtime/l3_key_issue_research.py"
      - "runtime/key_issue_verifier.py"

permissions:
  contents: write

concurrency:
  group: materialize-l3-key-issues
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m runtime.research_preflight
  research:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - batch: north
            counties: "基隆市,台北市,新北市,桃園市,新竹市,新竹縣"
          - batch: central
            counties: "苗栗縣,台中市,彰化縣,南投縣,雲林縣"
          - batch: south
            counties: "嘉義市,嘉義縣,台南市,高雄市,屏東縣"
          - batch: east_islands
            counties: "宜蘭縣,花蓮縣,台東縣,澎湖縣,金門縣,連江縣"

    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OGASAWARA_AUTO_RESEARCH: "true"
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      RESEARCH_LLM_MODEL: glm-5.3-flash
      RESEARCH_LLM_BASE_URL: https://opencode.ai/zen/go/v1
      RESEARCH_FOREGROUND_SECONDS: "60"
      RESEARCH_DAILY_SEARCHES: "180"
      RESEARCH_DAILY_TOKEN_BUDGET: "700000"

    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/feishu-election-bot-v1.4-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require automatic-research credentials
        run: |
          test -n "$OPENCODE_GO_API_KEY" || (echo "OPENCODE_GO_API_KEY secret is missing" && exit 2)
          test -n "$TAVILY_API_KEY" || (echo "TAVILY_API_KEY secret is missing" && exit 2)

      - name: Research, counter-check and promote county key issues
        run: |
          python -m runtime.l3_key_issue_research \
            --counties "${{ matrix.counties }}" \
            --max-findings 3 \
            --apply \
            --manifest-name "l3_key_issue_research_${{ matrix.batch }}.json"

      - name: Commit verified key issues and batch audit
        if: always()
        run: |
          test -f "data/manifests/l3_key_issue_research_${{ matrix.batch }}.json" || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/local knowledge/counties "data/manifests/l3_key_issue_research_${{ matrix.batch }}.json"
          git add -u cache/knowledge_promotion cache/retrieval || true
          if git diff --cached --quiet; then
            echo "No verified L3 key-issue changes for ${{ matrix.batch }}."
            exit 0
          fi
          git commit -m "data: verify L3 county key issues (${{ matrix.batch }})"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin feature/feishu-election-bot-v1.4-integration
            if git push origin HEAD:feature/feishu-election-bot-v1.4-integration; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to push L3 key-issue batch after retries."
          exit 1

  finalize-coverage:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout materialized feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/feishu-election-bot-v1.4-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild repository-wide knowledge coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from runtime.knowledge_coverage import KnowledgeCoverageAudit

          report = KnowledgeCoverageAudit(Path.cwd()).build()
          path = Path("data/manifests/knowledge_coverage_latest.json")
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report["summary"], ensure_ascii=False, indent=2))
          PY

      - name: Commit final coverage audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/knowledge_coverage_latest.json
          if git diff --cached --quiet; then
            echo "Knowledge coverage is already current."
            exit 0
          fi
          git commit -m "data: refresh L3 knowledge coverage"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin feature/feishu-election-bot-v1.4-integration
            if git push origin HEAD:feature/feishu-election-bot-v1.4-integration; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to push final L3 coverage audit."
          exit 1
