name: Materialize CEC baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/feishu-election-bot-v1.4-integration
    paths:
      - ".github/workflows/materialize-cec-baseline.yml"
      - "runtime/cec_open_data.py"
      - "runtime/cec_offline_import.py"
      - "runtime/knowledge_coverage.py"
      - "runtime/election_normalizer.py"
      - "runtime/matrix_builder.py"

permissions:
  contents: write

concurrency:
  group: materialize-cec-baseline
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/feishu-election-bot-v1.4-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download official CEC archive and materialize 22-county baseline
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          from runtime.cec_open_data import (
              CECOpenDataAdapter,
              _quoted_url,
              _ssl_context,
          )
          from runtime.cec_offline_import import (
              DEFAULT_BOUNDARY_SOURCE_URL,
              run_import,
          )
          from runtime.county_knowledge import COUNTIES
          from runtime.knowledge_coverage import KnowledgeCoverageAudit

          root = Path(".").resolve()
          cache = root / "cache" / "raw" / "cec"
          adapter = CECOpenDataAdapter(cache_dir=cache)
          archive = adapter.archive.ensure(force=True)

          boundary_path = cache / "term11-legislative-boundaries.csv"
          try:
              request = urllib.request.Request(
                  _quoted_url(DEFAULT_BOUNDARY_SOURCE_URL),
                  headers={
                      "User-Agent": "ogasawara-election-analysis/1.4",
                      "Accept": "text/csv,text/plain,*/*",
                  },
              )
              with urllib.request.urlopen(
                  request, timeout=60, context=_ssl_context()
              ) as response:
                  payload = response.read()
              if payload:
                  boundary_path.parent.mkdir(parents=True, exist_ok=True)
                  boundary_path.write_bytes(payload)
                  print("BOUNDARY_DOWNLOAD=ok", len(payload))
              else:
                  boundary_path = None
                  print("BOUNDARY_DOWNLOAD=empty")
          except Exception as exc:
              boundary_path = None
              print("BOUNDARY_DOWNLOAD=failed", type(exc).__name__, str(exc))

          report = run_import(
              root,
              archive_path=archive.path,
              boundary_csv=boundary_path,
              counties=COUNTIES,
          )
          missing = int(
              (report.get("archive_import") or {}).get("missing_or_invalid") or 0
          )
          print("CEC_IMPORT_FILLED=", (report.get("archive_import") or {}).get("filled_or_complete"))
          print("CEC_IMPORT_MISSING=", missing)
          coverage = KnowledgeCoverageAudit(root).build()
          coverage_path = root / "data" / "manifests" / "knowledge_coverage_latest.json"
          coverage_path.parent.mkdir(parents=True, exist_ok=True)
          coverage_path.write_text(
              json.dumps(coverage, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("COVERAGE_SUMMARY=", json.dumps(coverage["summary"], ensure_ascii=False))
          PY

      - name: Commit verified generated CEC data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/elections             data/geography/administrative_areas             data/geography/electoral_districts             data/matrices/cec             data/manifests
          if git diff --cached --quiet; then
            echo "No generated CEC changes to commit."
            exit 0
          fi
          git commit -m "data: materialize verified CEC baseline artifacts"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin feature/feishu-election-bot-v1.4-integration
            if git push origin HEAD:feature/feishu-election-bot-v1.4-integration; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push materialized data after retries."
          exit 1

      - name: Enforce complete CEC coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/manifests/cec_offline_import_latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          missing = int((report.get("archive_import") or {}).get("missing_or_invalid") or 0)
          filled = int((report.get("archive_import") or {}).get("filled_or_complete") or 0)
          print(f"CEC_IMPORT_FILLED={filled}")
          print(f"CEC_IMPORT_MISSING={missing}")
          if missing:
              raise SystemExit(f"CEC import still has {missing} missing/invalid slices")
          PY
