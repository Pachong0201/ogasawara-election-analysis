version: 1.4.0
name: campaign_state
purpose: >
  规范 Live Campaign State 的观察窗口、当前数据充分性、事件门禁、
  快照比较与同源民调变化。该配置只描述运行规则，不评价候选人优劣。

windows_days: [7, 14, 30]
retrieval_recency_days: 30
persist_snapshots: true

current_data_status:
  available: current_data_available
  unverified: current_data_unverified
  insufficient: insufficient_current_data
  rule: >
    只有存在新鲜且可验证的当前候选人、L4事件或L5民调时，才能标记
    current_data_available。仅有 lead_only 检索线索时标记 current_data_unverified。
    离线运行或当前动态资料全部缺失/过期时标记 insufficient_current_data。

event_gate:
  trigger_source_grades: [A, B, C]
  c_requires_verified: true
  d_e_trigger_allowed: false
  conflict_behavior: requires_review
  deduplicate: true

trigger_event_types:
  - nomination
  - candidate_registration
  - candidate_withdrawal
  - endorsement
  - party_cooperation
  - alliance
  - alliance_break
  - campaign_org
  - campaign_headquarters
  - debate
  - policy
  - major_issue
  - judicial_event
  - controversy

poll:
  same_series_change_observe_pp: 3.0
  signature_fields:
    - pollster
    - commissioner
    - method
    - sample_frame
    - question_wording
  rule: >
    不同 series_signature 不计算趋势；同一系列只描述点估计变化，
    不自行判断统计显著，不转化为胜负概率。

snapshot:
  storage: cache/campaign_state/
  compare_fields:
    - candidate_keys
    - event_ids
    - poll_ids
  allowed_change_status: [baseline_created, changed, unchanged]
