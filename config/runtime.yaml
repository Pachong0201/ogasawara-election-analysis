version: 1.0.0
name: runtime
skill_version: 1.1.0

mode: auto

network:
  allow_online: true
  fallback_to_offline: true

storage:
  persist_historical_election: true
  persist_historical_knowledge: true
  cache_dynamic_data: true

analysis:
  require_readiness_gate: true
  allow_partial_analysis: true
  allow_insufficient_analysis: false

provenance:
  write_manifest: true

paths:
  elections: data/elections
  geography: data/geography
  knowledge_historical: knowledge/historical
  knowledge_local: knowledge/local
  cache_candidates: cache/candidates
  cache_polls: cache/polls
  cache_events: cache/events
  cache_retrieval: cache/retrieval

analysis_requirements:
  county_mayor:
    historical_same_type:
      minimum_periods: 3
      required: true
    president:
      minimum_periods: 3
      required: true
    regional_legislator:
      minimum_periods: 3
      required: preferred
    township_level:
      required: true
    current_candidate_list:
      required: true
    local_knowledge:
      required: conditional
    polls:
      required: false
  president:
    historical_same_type:
      minimum_periods: 3
      required: true
    regional_legislator:
      minimum_periods: 3
      required: preferred
    township_level:
      required: true
    current_candidate_list:
      required: true
    local_knowledge:
      required: conditional
    polls:
      required: false
  regional_legislator:
    historical_same_type:
      minimum_periods: 3
      required: true
    president:
      minimum_periods: 3
      required: preferred
    township_level:
      required: true
    current_candidate_list:
      required: true
    local_knowledge:
      required: conditional
    polls:
      required: false

election_calendar:
  president: [2012, 2016, 2020, 2024, 2028, 2032]
  county_mayor: [2010, 2014, 2018, 2022, 2026, 2030]
  regional_legislator: [2012, 2016, 2020, 2024, 2028, 2032]
  party_list: [2012, 2016, 2020, 2024, 2028, 2032]

readiness:
  hard_required_categories:
    - historical_same_type
    - presidential
    - geography
    - township_level
    - current_candidate_list
    - source_grade
    - boundary_compatibility
  preferred_categories:
    - regional_legislator
  conditional_categories:
    - local_knowledge
  optional_categories:
    - current_polls
  allowed_fact_source_grades: [A, B]
  warning_fact_source_grades: [C]
  forbidden_fact_source_grades: [D, E]
  min_township_records: 1
  require_boundary_compatibility: true
  fresh_poll_required_for_ready: false

metrics:
  thresholds:
    swing_gap_observe: 8.0
    swing_gap_strong_trigger: 12.0
    neighbor_divergence_observe: 10.0
    neighbor_divergence_strong_trigger: 15.0
    candidate_residual_observe: 8.0
    candidate_residual_strong_trigger: 12.0
    cross_level_gap_observe: 8.0
    cross_level_gap_strong_trigger: 12.0
    spatial_variance_observe: 0.25
    spatial_variance_strong_trigger: 0.40
    geographic_concentration_observe: 0.40
    geographic_concentration_strong_trigger: 0.55
    concentration_excess_min: 0.05
    spatial_variance_low_share_threshold: 0.20
  spatial_variance_primary_method: standard_deviation
  spatial_variance_low_share_threshold: 0.20
  concentration_top_n: 3
