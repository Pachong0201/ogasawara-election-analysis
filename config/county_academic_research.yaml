version: 1.0.0
as_of: 2026-09-26
purpose: >
  补充原22县市基线中尚缺的19县市地方政治、派系、农渔会及组织动员学术研究。
  本文件默认只产生B级 retrieval lead，不直接晋升为2026年当前政治事实。
coverage_policy:
  expected_counties:
    - 基隆市
    - 台北市
    - 桃園市
    - 新竹市
    - 新竹縣
    - 苗栗縣
    - 台中市
    - 彰化縣
    - 南投縣
    - 雲林縣
    - 嘉義市
    - 嘉義縣
    - 屏東縣
    - 宜蘭縣
    - 花蓮縣
    - 台東縣
    - 澎湖縣
    - 金門縣
    - 連江縣
  excluded_existing_baseline_counties: [新北市, 台南市, 高雄市]
  default_promote: false
  note: >
    论文中的派系边界、人物关系、组织动员能力均受研究年代和个案范围限制；
    未经近期独立来源复核，不得用于描述2026年当前关系或推断选举结果。

