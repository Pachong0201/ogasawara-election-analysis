academic_records:
  - county: 高雄市
    lead_id: academic-kaohsiung-factions-2018
    source_id: nsysu_thesis_106NSYS5227006
    source_name: 国立中山大学硕士论文《台湾县市合并改制后对地方派系存续的影响—以原高雄县为例》
    source_grade: B
    independence_key: nsysu_thesis_106NSYS5227006
    published_at: 2018-01-01
    url: https://ndltd.ncl.edu.tw/cgi-bin/gs32/gsweb.cgi/login?o=dnclcdr&s=id%3D%22106NSYS5227006%22.&searchmode=basic
    topic: political_networks
    promote: true
    target_type: historical_claim
    record_id: kh-academic-factions-2018
    claim: 该论文对县市合并后的原高雄县地方派系进行研究，认为派系并未因合并而消失，但红、白、黑等网络呈现分化、跨党移动或政党化等不同变化。
    time_scope: 2010-2018
    scope_boundary: 仅作为该论文研究时段内的历史解释；不得外推为2026年仍维持同一派系边界、动员能力或候选人支持效果。
  - county: 台南市
    lead_id: academic-tainan-council-2005
    source_id: ncku_thesis_093NCKU5635007
    source_name: 国立成功大学硕士论文《地方府会关系中的政党政治—以台南为例（1998-2001）》
    source_grade: B
    independence_key: ncku_thesis_093NCKU5635007
    published_at: 2005-01-01
    url: https://ndltd.ncl.edu.tw/cgi-bin/gs32/gsweb.cgi/ccd%3DFHl9GY/search?s=id%3D%22093NCKU5635007%22.&searchmode=basic
    topic: political_networks
    promote: true
    target_type: historical_claim
    record_id: tn-academic-council-1998-2001
    claim: 该论文对1998至2001年台南府会关系的研究指出，府会由不同政党控制并非冲突的充分条件，政治领导与党团互动也是解释当时关系的重要因素。
    time_scope: 1998-2001
    scope_boundary: 仅限论文所研究的1998至2001年府会互动，不用于推断当前党团关系或任何选举结果。
  - county: 新北市
    lead_id: academic-newtaipei-farmers-factions
    source_id: nccu_thesis_099NCCU5011014
    source_name: 国立政治大学学位论文《台湾农会、派系与地方选举之关系：以新北市为例》
    source_grade: B
    independence_key: nccu_thesis_099NCCU5011014
    published_at: 2011-01-01
    url: https://tci.ncl.edu.tw/cgi-bin/gs32/gsweb.cgi?o=dnclresource&s=id%3D%22099NCCU5011014%22.&searchmode=basic&tcihsspage=tcisearch_opt1_search
    topic: political_networks
    promote: false
    summary: 该研究题名与索引确认其处理新北市农会、派系与地方选举关系；本轮未取得足以支持具体关系陈述的全文段落，故只保留为B级线索。

