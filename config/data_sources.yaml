version: 1.2.0
name: data_sources
purpose: >
  数据来源注册表。分析逻辑不得写死具体网站 URL；所有来源通过本表
  或运行时注册的 Adapter 注入。

election_results:
  primary:
    - id: cec
      name: 中央选举委员会
      grade: A
      type: official
      priority: 1
      adapter: cec_open_data_adapter
      dataset_page: https://data.gov.tw/dataset/13119
      download_url: https://data.cec.gov.tw/選舉資料庫/votedata.zip
      notes: 官方选举资料优先来源；V1.2 已接入 votedata.zip Adapter。
  secondary:
    - id: local_cec
      name: 地方选举委员会
      grade: A
      type: official
      priority: 2
      adapter: null
      notes: 用于补充或核对中选会未涵盖的地方层级资料。
  fallback:
    - id: verified_public_dataset
      name: 经验证的公开结构化资料集
      grade: B
      type: structured
      priority: 3
      adapter: null
      notes: 仅作为官方来源缺失时的替代，必须记录版本与来源。

academic:
  primary:
    - id: national_thesis_database
      name: 台湾博硕士论文知识加值系统
      grade: B
      type: academic
      priority: 1
    - id: university_repository
      name: 大学机构典藏
      grade: B
      type: academic
      priority: 2
  additional:
    - id: academic_journal
      name: 学术期刊与专书
      grade: B
      type: academic
      priority: 3

current_news:
  preferred:
    - id: reliable_national_media
      name: 可靠全国性媒体
      grade: C
      type: media
      priority: 1
    - id: reliable_local_media
      name: 可靠地方媒体
      grade: C
      type: media
      priority: 2

campaign:
  grade: D
  sources:
    - id: campaign_official
      name: 政党、候选人、竞选团队与相关利益方正式发布
      type: campaign
      priority: 1
  notes: 只能作为 campaign_claim 或验证线索，不得单独形成结构性判断。

social_unverified:
  grade: E
  notes: 只能作为未验证线索，不得单独形成结构性判断。

adapters:
  registered:
    - cec_open_data_adapter
  registered_candidate_adapters:
    - cec_current_candidate_adapter
  builtin:
    cec_open_data_adapter:
      source_id: cec_open_data
      grade: A
      priority: 1
      cache_path: cache/raw/cec/votedata.zip
      supported_elections:
        president: [2016, 2020, 2024]
        regional_legislator: [2016, 2020, 2024]
        county_mayor: [2014, 2018, 2022]
      supported_levels: [township_district, county_city]
      network_behavior:
        download_once: true
        reuse_cached_archive: true
        max_archive_bytes: 536870912
      notes:
        - 使用中选会官方选举资料库 ZIP，不抓取第三方整理页。
        - ZIP 文件名需按 CP950/Big5 元数据处理。
        - 2016 总统/立委文件采用特殊后缀，Adapter 自动发现。
  candidate_builtin:
    cec_current_candidate_adapter:
      source_id: cec_current_candidates
      grade: A
      priority: 1
      page_url: https://web.cec.gov.tw/central/article/64733
      supported_elections:
        county_mayor: [2026]
      status_semantics:
        candidate_status: registered
        notes: 登记名册仅证明已办理登记，不代表资格审定结果。
      notes:
        - 读取中选会115年地方公职人员选举候选人登记名册页面。
        - 自动定位1-1直辖市长与3-1县市长登记汇总表PDF。
        - PDF表格字段包括选举区、登记日期、姓名、推荐政党、备注。
  planned:
    - local_cec_adapter
    - verified_public_dataset_adapter
