version: 1.3.0
schema_name: knowledge_proposal
description: >
  V1.3 知识晋升候选对象。宿主 Agent 先把 retrieval lead 整理为结构化 proposal，
  Builder 只做确定性的证据、时间、冲突与字段门禁，不从自然语言摘要自行猜测政治关系。

type: object
required:
  - proposal_id
  - county
  - target_type
  - target_record
  - evidence_lead_ids
  - contradiction_check_completed
  - scope_boundary
properties:
  proposal_id:
    type: string
  county:
    type: string
  target_type:
    type: string
    enum:
      - historical_claim
      - local_relationship
      - candidate_profile
      - current_issue
  target_record:
    type: object
    description: >
      拟写入长期 knowledge/ 的完整结构化对象。字段必须符合对应目标 schema。
  evidence_lead_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string}
  contradictory_lead_ids:
    type: array
    uniqueItems: true
    items: {type: string}
  contradiction_check_completed:
    type: boolean
    description: >
      宿主是否已针对同一命题主动查找相反证据。true 不代表不存在相反证据，
      只表示该检查步骤已经执行。
  scope_boundary:
    type: string
    description: 该知识对象允许支持的范围与不得外推的边界。
  research_questions:
    type: array
    items: {type: string}
  requested_by:
    type: string
  created_at:
    type: string
  notes:
    type: string

constraints:
  - Builder 不得从 summary 自动生成 subject、object、relationship_type、current_status 或因果关系。
  - 所有 evidence_lead_ids 必须能在该县 cache/retrieval 中解析。
  - 用于晋升的 lead 必须 verification_status=verified。
  - A/B 级 verified lead 可满足基本晋升门槛；C 级必须至少两个独立来源。
  - C 级来源的独立性必须依赖不同 independence_key，不得仅凭不同 URL 推断独立。
  - D/E 级 lead 永远不能单独晋升长期知识。
  - contradiction_check_completed 不为 true 时不得晋升。
  - 已验证 contradictory lead 存在时不得自动晋升。
  - 当前关系必须具有 time_scope 与 last_verified_at；历史关系不得自动转为 active_verified。
