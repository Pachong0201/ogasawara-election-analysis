version: 1.4.0
schema_name: historical_claim
description: >
  L2 历史政治知识中的非关系型历史事实。仅描述 time_scope 内可证实的历史现象，
  不得自动外推为当前政治关系或当前选举因果。

type: object
required:
  - claim_id
  - claim
  - time_scope
  - source
  - source_grade
properties:
  claim_id: {type: string}
  claim: {type: string}
  county: {type: string}
  region: {type: string}
  topic: {type: string}
  layer_id:
    type: string
    enum: [L2]
  time_scope:
    type: string
  source:
    type: string
  source_grade:
    type: string
    enum: [A, B, C, D, E]
  source_reference:
    type: string
  independent_source_count:
    type: integer
    minimum: 0
  research_questions:
    type: array
    items: {type: string}
  scope_boundary:
    type: string
  uncertainty:
    type: object
    properties:
      level: {type: string, enum: [low, medium, high, unknown]}
      reason: {type: string}
      competing_explanations:
        type: array
        items: {type: string}
  evidence:
    type: array
    items:
      type: object
      properties:
        source: {type: string}
        source_grade: {type: string, enum: [A, B, C, D, E]}
        reference: {type: string}
        date: {type: [string, "null"]}
        retrieved_at: {type: string}
        lead_id: {type: string}
        independence_key: {type: string}
  promotion_provenance:
    type: object
    properties:
      proposal_id: {type: string}
      promoted_at: {type: string}
      builder_version: {type: string}
      evidence_lead_ids:
        type: array
        items: {type: string}
      evidence_grades:
        type: array
        items: {type: string}
      contradiction_check_completed: {type: boolean}
      contradictory_lead_ids:
        type: array
        items: {type: string}
      contradiction_check_note: {type: string}
  record_type:
    type: string
    enum: [historical_claim]
  notes: {type: string}

constraints:
  - time_scope 必须明确，历史事实只能在该范围内使用。
  - source_grade=D/E 时不得通过 KnowledgePromotionBuilder 晋升。
  - C 级晋升必须由至少两个 independence_key 不同的 verified 来源支撑。
  - scope_boundary 必须说明不得外推的范围。
  - historical_claim 不得被直接转换为 active_verified 当前关系。
