$schema: "https://json-schema.org/draft/2020-12/schema"
title: CampaignMediaEvent
description: >
  由公开文章正文经确定性证据摘录、实体识别和跨来源聚类形成的 L4 动态媒体研究事件。
  它与 schemas/campaign_event.yaml 的已验证标准事件分离，不得自动升级为 A/B 级事实。
type: object
required:
  - event_id
  - record_type
  - jurisdiction
  - date
  - event_date
  - event_type
  - verification_status
  - source_grade
  - independent_source_count
  - structural_use
properties:
  event_id: {type: string, minLength: 1}
  record_type:
    const: campaign_event
  jurisdiction: {type: string, minLength: 1}
  date: {type: string, format: date}
  event_date: {type: string, format: date}
  date_basis:
    enum: [media_report_date_proxy, publisher_page_date, first_seen_at]
  event_type: {type: string, minLength: 1}
  claim_type: {type: string}
  candidate_entities:
    type: array
    items: {type: string}
  locations:
    type: array
    items: {type: string}
  independent_source_count: {type: integer, minimum: 1}
  independence_keys:
    type: array
    items: {type: string}
  verification_status:
    enum: [single_source_media, corroborated_media]
  source_grade:
    enum: [C]
  source_id: {type: string}
  evidence_status:
    enum: [single_source_report, cross_source_corroborated]
  structural_use:
    enum: [context_only, research_trigger_only]
  source_urls:
    type: array
    items: {type: string}
  sources:
    type: array
    items:
      type: object
      properties:
        title: {type: string}
        url: {type: string}
        domain: {type: string}
        page_date: {type: string}
        first_seen_at: {type: string}
        body_status: {type: string}
        content_sha256: {type: string}
        evidence_excerpt: {type: string}
  evidence_excerpt: {type: string}
  interpretation_limit: {type: string}
additionalProperties: true

constraints:
  - single_source_media 只能作为 context_only，不得独立触发结构研究。
  - corroborated_media 至少需要两个 independence_key 不同且正文已读取的公开来源。
  - corroborated_media 只能作为 research_trigger_only，不得称为已验证事实。
  - 媒体报道日期代理不得伪装成已核实事件发生时间。
  - 任何媒体事件都不得单独用于胜负预测、候选人排名或政治推荐。
