version: 1.2.0
schema_name: poll
description: >
  民调数据库记录。民调只在历史结构与地方知识之后用于校准。
  不同机构、不同调查方式的资料不得直接连成趋势线。

type: object
required:
  - poll_id
  - pollster
  - commissioner
  - method
  - sample_size
  - sample_frame
  - sampling
  - weighting
  - field_start
  - field_end
  - publish_date
  - moe
  - moe_applicable
  - undecided
  - question_wording
  - cross_tabs_available
  - source
  - source_grade
properties:
  poll_id:
    type: string
  jurisdiction:
    type: string
  official_jurisdiction:
    type: string
  election_type:
    type: string
  election_year:
    type: integer
  scenario:
    type: string
    description: 同一份民调中的候选人组合或题目情境，不得跨情境直接比较。
  pollster:
    type: string
  commissioner:
    type: string
    description: 委托方；自办民调填 self。
  method:
    type: string
    enum:
      - telephone_landline
      - telephone_mobile
      - telephone_mixed
      - online_closed
      - face_to_face
      - mixed
      - unknown
  sample_size:
    type: integer
    minimum: 1
  sample_frame:
    type: string
  sampling:
    type: string
    description: 抽样方法，例如分层随机、电话后四码。
  weighting:
    type: string
    description: 加权方式；无加权时明确写 none。
  field_start:
    type: string
    format: date
  field_end:
    type: string
    format: date
  publish_date:
    type: string
    format: date
  moe:
    type: number
    nullable: true
    description: >
      抽样误差，以百分点表示；例如 2.9。封闭网络调查等
      moe_applicable=false 时允许为 null。
  moe_applicable:
    type: boolean
    description: >
      该调查是否可套用传统抽样误差。online_closed 通常为 false。
  undecided:
    type: number
    minimum: 0
    maximum: 1
    description: 未决定比例，以小数表示；例如 0.18。
  question_wording:
    type: string
    description: >
      问卷逐字题目；若来源只公开报告情境而未公开逐字题目，必须明确标记
      question_wording_is_verbatim=false，不得把摘要改写伪装成原题。
  question_wording_is_verbatim:
    type: boolean
  cross_tabs_available:
    type: boolean
  confidence_level:
    type: number
  candidate_support:
    type: array
    items:
      type: object
      properties:
        candidate: {type: string}
        support: {type: number, minimum: 0, maximum: 1}
        party: {type: string}
  region_cross_tabs:
    type: array
    description: 地区交叉表；小样本时必须标注样本数。
    items:
      type: object
      properties:
        region: {type: string}
        sample_size: {type: integer}
        values: {type: object}
  age_cross_tabs:
    type: array
    items:
      type: object
      properties:
        age_band: {type: string}
        sample_size: {type: integer}
        values: {type: object}
  party_support_cross_tabs:
    type: array
    items:
      type: object
      properties:
        party: {type: string}
        sample_size: {type: integer}
        values: {type: object}
  vote_intention_cross_tabs:
    type: array
    items:
      type: object
      properties:
        segment: {type: string}
        sample_size: {type: integer}
        values: {type: object}
  campaign_claim:
    type: boolean
    description: 阵营内部民调且无公开方法时必须为 true。
  source:
    type: string
  source_grade:
    type: string
    enum: [A, B, C, D, E]
  source_id:
    type: string
  source_reference:
    type: string
  source_version:
    type: string
  retrieved_at:
    type: string
  last_verified_at:
    type: string
  expires_at:
    type: string
    format: date
  funding_source:
    type: string
  notes:
    type: string

constraints:
  - POLL-01: 不同 pollster 的数据不得直接连成趋势线。
  - POLL-02: 电话调查与封闭式网络调查不得直接计算上涨或下降。
  - POLL-03: campaign_claim=true 时只能记录为阵营主张。
  - POLL-04: 若调查机构未提供候选人差值的标准误、区间估计或统计显著性检验，不得仅凭点估计宣称统计上存在明确差距；应写“点估计存在差异，但调查资料不足以确认该差异具有统计上的明确区分意义”。
  - POLL-05: undecided 大于 0.15 时必须单独指出。
  - POLL-06: 交叉样本小于 100 或未公开样本数时，不得过度解释。
  - POLL-07: 民调用于检验当前状态是否偏离历史结构，不替代历史结构。
  - POLL-08: moe_applicable=false 时不得套用传统随机抽样误差。
  - 民调 freshness 必须依据 field_end/publish_date，而不是最近抓取时间；重新抓取旧民调不得使其变成“新民调”。
  - source_reference 应优先指向原始民调报告或 PDF；媒体二次报道不得覆盖原始来源。
