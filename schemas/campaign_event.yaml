version: 1.4.0
schema_name: campaign_event
description: >
  由公开文章正文经确定性证据提取、实体识别和跨来源聚类生成的当前选战事件。
  该对象属于 L4 当前选举事件层的动态研究对象，不自动成为长期知识事实。

type: object
required:
  - event_id
  - jurisdiction
  - event_date
  - event_type
  - verification_status
  - source_grade
  - independent_source_count
  - structural_use
properties:
  event_id:
    type: string
  record_type:
    const: campaign_event
  jurisdiction:
    type: string
  event_date:
    type: string
    format: date
  date:
    type: string
    format: date
  date_basis:
    type: string
    enum:
      - media_report_date_proxy
      - official_event_date
      - verified_event_date
  event_type:
    type: string
  claim_type:
    type: string
  candidate_entities:
    type: array
    items: {type: string}
  locations:
    type: array
    items: {type: string}
  independent_source_count:
    type: integer
    minimum: 1
  independence_keys:
    type: array
    items: {type: string}
  verification_status:
    type: string
    enum:
      - single_source_media
      - corroborated_media
      - verified
      - confirmed
  source_grade:
    type: string
    enum: [A, B, C, D, E]
  evidence_status:
    type: string
    enum:
      - single_source_report
      - cross_source_corroborated
      - verified_fact
  structural_use:
    type: string
    enum:
      - context_only
      - research_trigger_only
      - verified_event
  source_urls:
    type: array
    items: {type: string}
  sources:
    type: array
    items:
      type: object
      properties:
        title: {type: string}
        url: {type: string}
        domain: {type: string}
        page_date: {type: string}
        first_seen_at: {type: string}
        body_status: {type: string}
        content_sha256: {type: string}
        evidence_excerpt: {type: string}
  evidence_excerpt:
    type: string
  interpretation_limit:
    type: string

constraints:
  - single_source_media 只能作为 context_only，不得独立触发结构判断。
  - corroborated_media 至少需要两个 independence_key 不同且正文已读取的公开来源。
  - corroborated_media 只能作为 research_trigger_only，不得自动升级为 A/B 级事实。
  - 跨来源相互印证只表示多家独立媒体正文对同一事件描述一致，不等于官方或原始证据核实。
  - D/E 级原始线索不得自动写入 knowledge/。
  - event_date 来自媒体报道日期代理时必须保留 date_basis=media_report_date_proxy。
  - 任何 campaign event 都不得单独用于胜负预测、候选人排名或政治推荐。
