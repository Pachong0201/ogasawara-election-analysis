version: 1.4.0
schema_name: knowledge_promotion_receipt
description: 知识晋升门禁与持久化结果，供审计、重跑和 county package manifest 使用。

type: object
required:
  - receipt_id
  - proposal_id
  - county
  - target_type
  - decision
  - checked_at
properties:
  receipt_id: {type: string}
  proposal_id: {type: string}
  county: {type: string}
  target_type: {type: string}
  decision:
    type: string
    enum: [promoted, rejected, requires_review, dry_run_pass]
  checked_at: {type: string}
  target_path: {type: string}
  record_id: {type: string}
  evidence_lead_ids:
    type: array
    items: {type: string}
  evidence_grades:
    type: array
    items: {type: string}
  independent_source_count: {type: integer}
  contradiction_check_completed: {type: boolean}
  contradictory_lead_ids:
    type: array
    items: {type: string}
  contradiction_check_note: {type: string}
  reasons:
    type: array
    items: {type: string}
  warnings:
    type: array
    items: {type: string}
  record_sha256: {type: string}
  evidence_snapshot_sha256: {type: string}
  knowledge_builder_version: {type: string}
