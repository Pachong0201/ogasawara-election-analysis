version: 1.4.0
name: writing_rules
purpose: >
  统一县市分析的写作结构、语气和事实／解释分界。判断前置，小切口进入，
  事实嵌入判断，县市总体判断下钻到具体地区。

default_output_sections:
  - key: core_judgement
    title: 核心判断
    length: 150-250字
    must_answer: 截至 as_of，当前选战处于什么状态，最近发生的变化是否触及原有结构。
    first_sentence_rule: 不得从历史沿革或单一民调数字开始。
  - key: current_campaign_state
    title: 一、截至目前选战打到哪里
    must_analyze:
      - 当前候选人格局与提名/登记状态
      - 最近7日、14日、30日可验证变化
      - 与上一Campaign State Snapshot相比的新变化
  - key: change_since_last
    title: 二、最近哪些变化真正值得关注
    must_distinguish:
      - 已验证事件
      - 阵营主张
      - 未验证线索
      - 同源同方法民调变化
    rule: 只把变化当作研究触发，不直接当作因果证明。
  - key: historical_geography
    title: 三、这些变化相对历史结构意味着什么
    rule: 历史基准作为参照系，不得取代当前选战叙述。
  - key: where_change_happened
    title: 四、变化主要发生在哪里
    must_identify: 3—8个关键乡镇市区或明确说明现阶段尚无区级当前资料。
  - key: candidate_local_base
    title: 五、候选人及地方组织如何变化
    must_analyze:
      - 长期经营
      - 竞选组织
      - 地方公职公开支持
      - 候选人残差
      - 现任交棒或组织移转
  - key: third_force
    title: 六、第三势力和中间票如何重新组合
    rule: 不得机械加票，不得预设流向。
  - key: poll_calibration
    title: 七、当前民调是否验证选战变化
    must_compare:
      - 同一调查系列的可比变化
      - 不同调查方法之间的不可比限制
      - 未决定比例
      - 样本限制
  - key: structural_factors
    title: 八、当前竞争结构由哪些因素共同形成
    must_reduce_to: 2—4个经证据支持的结构因素
  - key: watchlist
    title: 九、下一阶段观察什么
    allowed_items:
      - 可公开验证的新事件
      - 同源后续民调
      - 地方人物公开表态
      - 竞选组织与政党合作变化
      - 关键行政区的新资料
    forbidden_items:
      - 某候选人必须拿到多少票才能获胜
      - 胜负概率
      - 候选人排名

style:
  current_campaign_first: true
  require_as_of: true
  judgment_first: true
  small_entry_point: true
  facts_embedded_in_judgement: true
  drill_down_from_county_to_locality: true
  use_specific_places_people_data: true
  distinguish:
    - fact
    - interpretation
    - campaign_claim
    - unverified_information
  avoid:
    - 新闻流水账
    - 大背景铺陈
    - 机械罗列民调
    - “一方面……另一方面……”大量套句
    - “不是……而是……”高频使用
    - 将所有解释归结为蓝绿基本盘

fact_expression:
  historical_baseline: >
    过去数届同类选举中，该阵营在此地通常维持约某一区间。
  candidate_residual: >
    该候选人在此地的得票相对所选政党或票种基准出现正/负残差。
  unknown: >
    现有数据可以确认该现象，但尚不能确定原因。
  alternative_explanations: >
    当前有两种可能解释，现有证据不足以区分。
  historical_stale: >
    历史资料显示过去存在该政治网络，但未找到足够资料确认其在当前选举中仍具有相同作用。

banned_expressions:
  - XX乡基本盘就是55%
  - 某候选人有22%个人票
  - 蓝白合作就有60%
  - 某候选人一定当选
  - 某候选人胜率为XX%
  - 候选人综合评分
  - 候选人排名
  - 买票
  - 做票
  - 某族群都支持某候选人
  - 某年龄层都支持某候选人

# Machine-checkable forms of the banned expressions, applied by
# runtime/report_validator.py to every generated report.
banned_patterns:
  - pattern: "基本盘(就是|为|是)\\s*\\d"
    reason: 把历史区间写成固定基本盘数字
  - pattern: "基本盤(就是|為|是)\\s*\\d"
    reason: 把历史区间写成固定基本盘数字
  - pattern: "个人票|個人票"
    reason: 统计残差不等于个人票
  - pattern: "(蓝白|藍白)(合作|合流|相加|加起来|加起來)"
    reason: 不得机械相加蓝白票
  - pattern: "一定(当选|當選|胜选|勝選)|稳赢|穩贏|必胜|必勝"
    reason: 禁止胜负预测
  - pattern: "胜率|勝率|当选概率|當選機率|当选机率|胜负概率|勝負機率"
    reason: 禁止胜率与概率
  - pattern: "综合评分|綜合評分|候选人排名|候選人排名"
    reason: 禁止评分与排名
  - pattern: "买票|買票|做票"
    reason: 不得依票型推断违法行为
  - pattern: "(族群|年龄层|年齡層|客家人|外省人|原住民)都(支持|投给|投給)"
    reason: 不得将群体整体归属某候选人
  - pattern: "一方面[^。]{0,40}另一方面"
    reason: 套句
  - pattern: "值得注意的是|不难看出|不難看出|众所周知|眾所周知|综上所述|綜上所述"
    reason: 空洞套话

report_contract:
  citation_format: "[F-001] 引用 findings；[S-cec-county_mayor-2022] 引用来源"
  max_core_numbers_per_paragraph: 3
  percentage_tolerance_pp: 0.15
  max_rewrite_rounds: 3
  paragraph_pattern: 判断句 → 核心数字/地名/人名 → 机制或可能解释 → 不确定性边界

quality_checks:
  - 核心判断是否先回答截至 as_of 的当前选战状态，而不是从历史沿革或民调数字开始。
  - 是否明确区分最近7/14/30天变化与长期历史基准。
  - 是否说明与上一Campaign State Snapshot相比新增了什么。
  - 是否明确标注 as_of，并先回答当前选战与最近30／14／7日变化。
  - 是否至少使用三届同类型选举建立历史基准。
  - 是否下钻到乡镇市区，必要时进一步下钻。
  - 是否分别区分事实、解释、阵营主张和未验证信息。
  - 是否说明哪些解释证据不足或 unknown。
  - 是否避免胜负预测、候选人评分或推荐。
  - 是否记录 time_scope、baseline_method、source_grade。
