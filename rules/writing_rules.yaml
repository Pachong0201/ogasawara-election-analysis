version: 1.4.0
name: writing_rules
purpose: >
  统一县市分析的写作结构、语气和事实／解释分界。判断前置，小切口进入，
  事实嵌入判断，县市总体判断下钻到具体地区。

default_output_sections:
  - key: core_judgement
    title: 核心判断
    length: 150-250字
    must_answer: 截至 as_of 当前选战处于什么阶段、最近发生了什么变化、这些变化是否触及历史结构。
    first_sentence_rule: 必须从当前竞争结构或最近变化切入，不得从历史沿革或单一民调数字起笔。
  - key: recent_campaign_delta
    title: 一、最近30／14／7日选战发生了什么变化
    must_analyze:
      - 候选人格局
      - 竞选组织与地方公职公开支持
      - 政党合作或联盟变化
      - 政策、争议、司法与重大地方议题
      - 新增民调及同源同方法调查变化
    rule: 先写已验证变化，再说明哪些只是 campaign_claim 或 retrieval lead。
  - key: historical_geography
    title: 二、这些变化放回历史结构意味着什么
    rule: >
      历史基准作为参照系，不得成为正文主角。至少使用三届同类型选举，
      说明当前变化是延续、回摆还是尚不足以判断。
  - key: change_since_last
    title: 二之一、与上一轮选举及上一快照相比发生了什么变化
    rule: >
      同时区分“相对上一届正式选举的结构变化”和“相对上一 Campaign State Snapshot 的近期变化”；
      不得把二者混为同一种 swing。

  - key: where_change_happened
    title: 三、当前变化主要发生在哪里
    must_identify: 3—8个关键乡镇市区（资料足够时）
    rule: 结合历史残差、地方组织与当前事件选择地区，不得只按人口机械排序。
  - key: candidate_local_base
    title: 四、候选人的地方政治基础目前如何变化
    must_analyze:
      - 长期经营
      - 历次参选
      - 地方组织
      - 候选人残差
      - 本轮新增支持或组织变化
  - key: third_force
    title: 五、第三势力和中间票当前如何重新组合
    rule: 不得机械加票，不得直接写第三势力票将转给某方。
  - key: poll_calibration
    title: 六、最新民调是否验证当前变化
    must_compare:
      - 调查方法
      - 同一调查系列的跨期变化
      - 交叉表
      - 未决定比例
      - 样本限制
    rule: 不同调查系列不得拼接成趋势；同源同方法变化也不得直接写成胜负趋势。
  - key: structural_factors
    title: 七、当前竞争结构由哪些因素共同形成
    must_reduce_to: 2—4个决定性结构因素
  - key: watchlist
    title: 八、下一阶段需要观察什么
    allowed_items:
      - 同一调查系列的新一轮民调
      - 第三势力支持者交叉表
      - 地方人物公开表态
      - 候选人在关键乡镇活动和组织变化
      - 新的乡镇或村里级数据
      - 已发生重大事件是否产生后续组织或议题变化
    forbidden_items:
      - 某候选人必须拿到多少票才能获胜
      - 胜负概率
      - 候选人排名

style:
  judgment_first: true
  small_entry_point: true
  facts_embedded_in_judgement: true
  drill_down_from_county_to_locality: true
  use_specific_places_people_data: true
  distinguish:
    - fact
    - interpretation
    - campaign_claim
    - unverified_information
  avoid:
    - 新闻流水账
    - 大背景铺陈
    - 机械罗列民调
    - “一方面……另一方面……”大量套句
    - “不是……而是……”高频使用
    - 将所有解释归结为蓝绿基本盘

fact_expression:
  historical_baseline: >
    过去数届同类选举中，该阵营在此地通常维持约某一区间。
  candidate_residual: >
    该候选人在此地的得票相对所选政党或票种基准出现正/负残差。
  unknown: >
    现有数据可以确认该现象，但尚不能确定原因。
  alternative_explanations: >
    当前有两种可能解释，现有证据不足以区分。
  historical_stale: >
    历史资料显示过去存在该政治网络，但未找到足够资料确认其在当前选举中仍具有相同作用。

banned_expressions:
  - XX乡基本盘就是55%
  - 某候选人有22%个人票
  - 蓝白合作就有60%
  - 某候选人一定当选
  - 某候选人胜率为XX%
  - 候选人综合评分
  - 候选人排名
  - 买票
  - 做票
  - 某族群都支持某候选人
  - 某年龄层都支持某候选人

quality_checks:
  - 核心判断是否直接回答结构问题，而不是从民调数字开始。
  - 是否明确标注 as_of，并先回答当前选战与最近30／14／7日变化。
  - 是否至少使用三届同类型选举建立历史基准。
  - 是否下钻到乡镇市区，必要时进一步下钻。
  - 是否分别区分事实、解释、阵营主张和未验证信息。
  - 是否说明哪些解释证据不足或 unknown。
  - 是否避免胜负预测、候选人评分或推荐。
  - 是否记录 time_scope、baseline_method、source_grade。
