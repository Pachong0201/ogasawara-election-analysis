version: 1.4.0
name: writing_rules
purpose: >
  统一县市分析的写作结构、语气和事实／解释分界。判断前置，小切口进入，
  事实嵌入判断，县市总体判断下钻到具体地区。

default_output_sections:
  - key: core_judgement
    title: 核心判断
    length: 150-250字
    must_answer: 截至 as_of，当前选战处于什么状态，最近发生的变化是否触及原有结构。
    first_sentence_rule: 不得从历史沿革或单一民调数字开始。
  - key: current_campaign_state
    title: 一、截至目前选战打到哪里
    must_analyze:
      - 当前候选人格局与提名/登记状态
      - 最近7日、14日、30日可验证变化
      - 与上一Campaign State Snapshot相比的新变化
  - key: change_since_last
    title: 二、最近哪些变化真正值得关注
    must_distinguish:
      - 已验证事件
      - 跨来源相互印证但仍待高等级来源确认的媒体事件
      - 单一媒体报道
      - 阵营主张
      - 未验证线索
      - 同源同方法民调变化
    rule: 只把变化当作研究触发，不直接当作因果证明。
  - key: historical_geography
    title: 三、这些变化相对历史结构意味着什么
    rule: 历史基准作为参照系，不得取代当前选战叙述。
  - key: where_change_happened
    title: 四、变化主要发生在哪里
    must_identify: 3—8个关键乡镇市区或明确说明现阶段尚无区级当前资料。
  - key: candidate_local_base
    title: 五、候选人及地方组织如何变化
    must_analyze:
      - 长期经营
      - 竞选组织
      - 地方公职公开支持
      - 候选人残差
      - 现任交棒或组织移转
  - key: third_force
    title: 六、第三势力和中间票如何重新组合
    rule: 不得机械加票，不得预设流向。
  - key: poll_calibration
    title: 七、当前民调是否验证选战变化
    must_compare:
      - 同一调查系列的可比变化
      - 不同调查方法之间的不可比限制
      - 未决定比例
      - 样本限制
  - key: structural_factors
    title: 八、当前竞争结构由哪些因素共同形成
    must_reduce_to: 2—4个经证据支持的结构因素
  - key: watchlist
    title: 九、下一阶段观察什么
    allowed_items:
      - 可公开验证的新事件
      - 同源后续民调
      - 地方人物公开表态
      - 竞选组织与政党合作变化
      - 关键行政区的新资料
    forbidden_items:
      - 某候选人必须拿到多少票才能获胜
      - 胜负概率
      - 候选人排名

style:
  current_campaign_first: true
  require_as_of: true
  current_data_gate:
    current: 可在证据范围内分析当前态势
    partial_current_data: 逐项注明现时证据缺口，不作完整当前态势判断
    insufficient_current_data: 仅可分析历史结构及待核线索，不得称当前选战已掌握
  judgment_first: true
  small_entry_point: true
  facts_embedded_in_judgement: true
  drill_down_from_county_to_locality: true
  use_specific_places_people_data: true
  distinguish:
    - fact
    - interpretation
    - corroborated_media
    - single_source_media
    - campaign_claim
    - unverified_information
  avoid:
    - 新闻流水账
    - 大背景铺陈
    - 机械罗列民调
    - “一方面……另一方面……”大量套句
    - “不是……而是……”高频使用
    - 将所有解释归结为蓝绿基本盘

fact_expression:
  historical_baseline: >
    过去数届同类选举中，该阵营在此地通常维持约某一区间。
  candidate_residual: >
    该候选人在此地的得票相对所选政党或票种基准出现正/负残差。
  unknown: >
    现有数据可以确认该现象，但尚不能确定原因。
  alternative_explanations: >
    当前有两种可能解释，现有证据不足以区分。
  historical_stale: >
    历史资料显示过去存在该政治网络，但未找到足够资料确认其在当前选举中仍具有相同作用。

banned_expressions:
  - XX乡基本盘就是55%
  - 某候选人有22%个人票
  - 蓝白合作就有60%
  - 某候选人一定当选
  - 某候选人胜率为XX%
  - 候选人综合评分
  - 候选人排名
  - 买票
  - 做票
  - 某族群都支持某候选人
  - 某年龄层都支持某候选人

quality_checks:
  - 核心判断是否先回答截至 as_of 的当前选战状态，而不是从历史沿革或民调数字开始。
  - 是否明确区分最近7/14/30天变化与长期历史基准。
  - 是否说明与上一Campaign State Snapshot相比新增了什么。
  - 是否明确标注 as_of，并先回答当前选战与最近30／14／7日变化。
  - 是否至少使用三届同类型选举建立历史基准。
  - 是否下钻到乡镇市区，必要时进一步下钻。
  - 是否分别区分事实、解释、阵营主张和未验证信息。
  - 是否说明哪些解释证据不足或 unknown。
  - 是否避免胜负预测、候选人评分或推荐。
  - 是否记录 time_scope、baseline_method、source_grade。

media_event_expression:
  corroborated_media: >
    可写为“多家独立媒体正文对该事件出现相互印证的报道”，并同时说明仍需官方资料、
    当事人原始声明或更高等级来源确认；不得简称“已核实事件”。
  single_source_media: >
    只能写为“某媒体报道”或“单一公开来源显示”，不得据此形成结构性判断。
  forbidden_inference:
    - 把媒体报道一致直接写成事实已获官方证实。
    - 把报道数量写成候选人声势、优势或胜率变化。
    - 把正文中的阵营说法转述成独立事实。
