version: 1.4.0
name: data_acquisition
purpose: >
  规定 V1.4 数据获取、本地化、验证、新鲜度、知识晋升、实时选战事件解析与离线行为的统一规则。
  不改变 V1.0 方法论，只让方法能够稳定运行。

principles:
  - id: DATA-01
    statement: 稳定历史选举事实优先本地读取，不每次联网重新抓取。
  - id: DATA-02
    statement: 本地缺失且 ONLINE 时，才允许调用已注册来源 Adapter 补齐。
  - id: DATA-03
    statement: 历史知识可以缓存，但必须保留 time_scope，不得自动外推当前。
  - id: DATA-04
    statement: 当前候选人、民调、公开支持、政党合作、竞选事件属于动态资料，必须记录 retrieved_at、last_verified_at、valid_until、source、source_grade。
  - id: DATA-05
    statement: Skill 本体不得假设运行环境一定联网，必须支持 ONLINE 与 OFFLINE 两种模式。
  - id: DATA-06
    statement: OFFLINE 不得伪装已完成联网检索；缺失必要资料时输出 analysis_status=insufficient_data。
  - id: DATA-07
    statement: 正式分析前必须执行 Data Readiness Check。
  - id: DATA-08
    statement: 动态资料过期必须重新验证，不得永久信任。
  - id: DATA-09
    statement: 任何写入长期数据或知识库的资料必须满足 A 级/B 级，或两个独立 C 级以上来源交叉确认。
  - id: DATA-10
    statement: D/E 级资料只能进入 cache/retrieval，标记 lead_only，不得升级到长期知识库。
  - id: DATA-11
    statement: retrieval lead 不属于长期知识；verified 只代表来源已核对，不代表事实已晋升。
  - id: DATA-12
    statement: 知识晋升必须由结构化 knowledge proposal 显式触发，运行时不得从摘要自动猜测政治关系。
  - id: DATA-13
    statement: C 级资料晋升必须有至少两个已验证且 independence_key 不同的独立来源。
  - id: DATA-14
    statement: 晋升前必须显式完成相反证据检查并填写 scope_boundary；存在已验证 A/B/C 级相反证据时转 requires_review。
  - id: DATA-15
    statement: 每次晋升必须生成 receipt，记录 proposal、证据 lead、哈希、决策、目标路径与 Builder 版本。
  - id: DATA-16
    statement: ONLINE 完整分析必须先生成带 as_of 的 Campaign State Snapshot，并主动检查最近30／14／7日选战变化。
  - id: DATA-17
    statement: 当前选战变化可以独立触发地方知识检索，不得要求必须先出现历史票型异常。
  - id: DATA-18
    statement: 宿主检索结果进入当前选战层前必须保留 verification_status 与 source_grade；lead_only 不得写成已确认事实。
  - id: DATA-19
    statement: 公开新闻正文必须先经过 evidence extraction 与 entity resolution，未读取正文的标题不得自动生成 Campaign Event。
  - id: DATA-20
    statement: 两个以上 independence_key 不同且正文已读取的媒体来源可以形成 corroborated_media 事件，但仅可作为 research_trigger_only，不得自动升级为 A/B 级事实。
  - id: DATA-21
    statement: Campaign State 的 7／14／30 日窗口与 snapshot_delta 必须纳入结构化 Campaign Event；原始 retrieval lead 与结构化事件必须分别保留。

source_selection:
  order:
    - local_validated_data
    - cec
    - local_cec
    - verified_public_dataset
    - academic
    - reliable_media
    - campaign_claim_only
  rule: >
    先查本地已校验数据；本地缺失时才按 config/data_sources.yaml 的
    priority 与 grade 调用。不得把网页 URL 写死在业务逻辑中。

local_first:
  required_steps:
    - 检查 data/elections/<type>/<year>/<jurisdiction>.jsonl 是否存在且校验通过。
    - 检查记录是否达到分析层级，例如 township_district。
    - 检查 boundary_version 是否可对齐。
    - 若完整，直接返回，不触发网络。
  completeness_definition:
    - 至少应有目标地区、目标年份、所需层级的记录。
    - 记录必须通过 election_normalizer 校验。
    - 记录必须属于允许的事实来源等级或已标记警告。

online_mode:
  allowed_actions:
    - 调用已注册 ElectionDataSource.fetch。
    - 调用已注册 RetrievalBackend.search / fetch 辅助地方知识检索。
    - 抓取后标准化、校验并写入本地或缓存。
  forbidden_actions:
    - 绕过 source registry 直接写死特定网站爬虫。
    - 每次调用覆盖已验证历史数据。
    - 将未验证内容直接写入长期知识库。

offline_mode:
  allowed_actions:
    - 读取本地历史选举数据。
    - 读取 knowledge/ 与 cache/ 中仍有时间有效性的资料。
    - 使用用户在本轮任务中提供的资料。
  required_outputs:
    - 明确标记 mode=offline。
    - 缺失必要资料时输出 MISSING_DATA。
    - analysis_status=insufficient_data（若硬性数据不足）。
  forbidden_actions:
    - 声称已联网查询。
    - 以模型记忆代替来源。

knowledge_promotion:
  policy_file: config/knowledge_promotion.yaml
  proposal_schema: schemas/knowledge_proposal.yaml
  receipt_schema: schemas/knowledge_promotion_receipt.yaml
  builder: runtime/knowledge_builder.py
  allowed_targets:
    - historical_claim
    - local_relationship
    - candidate_profile
    - current_issue
  decisions:
    - promoted
    - rejected
    - requires_review
    - dry_run_pass
  rules:
    - A/B 级 verified 来源可满足基础晋升门槛。
    - C 级必须至少两个 verified 且 independence_key 不同的独立来源。
    - D/E 级不得晋升。
    - active_verified 当前关系必须同时通过关系 freshness。
    - candidate_profile 与 current_issue 必须通过各自 freshness。
    - generated county package 只做索引，不生成新的政治事实。

persistence:
  long_term:
    - data/elections/
    - data/geography/
    - knowledge/historical/
    - knowledge/local/
  dynamic_cache:
    - cache/candidates/
    - cache/polls/
    - cache/events/
    - cache/retrieval/
  provenance_required_fields:
    - retrieved_at
    - verified_at
    - source_id
    - source_version
    - raw_reference
    - normalization_version

validation:
  required_checks:
    - votes >= 0
    - valid_votes >= votes
    - vote_share ≈ votes / valid_votes
    - 0 <= turnout <= 1
    - 行政区存在
    - 政党/候选人非空
    - source_grade 合法
    - boundary_version 存在
    - 按行政区候选人得票总和 ≈ valid_votes
  on_failure:
    validation_status: failed
    action: 不得进入正式分析，并记录 validation_errors。

freshness:
  policy_file: config/freshness.yaml
  rule: >
    动态资料超过 TTL 后必须重新验证；历史选举与历史学术资料可永久保存，
    但历史学术资料用于当前政治判断时必须重新验证。
  stale_behavior:
    - 标记 stale。
    - 若为 HARD REQUIRED，则 readiness 不得为 READY。
    - 若为 OPTIONAL，降低结论范围并记录 warning。

boundary_control:
  rule: >
    跨届比较前必须检查 administrative_area.yaml 中的 boundary_version、
    valid_from、valid_to、predecessor_regions、successor_regions。
  on_incompatible:
    - 禁止计算 Swing。
    - 禁止计算 Candidate Residual。
    - 禁止计算 Neighbor Divergence。
    - 除非存在明确、可追溯的行政区映射。

current_candidates:
  preferred_source: official_registration
  allowed_statuses: [registered, nominated, announced, potential]
  formal_candidate_status: registered
  rule: >
    正式登记前可以使用政党正式提名与公开参选声明，但只能标记为
    nominated、announced 或 potential，不得当作 registered 正式候选人。

polls:
  schema: schemas/poll.yaml
  storage: cache/polls/
  required_metadata:
    - pollster
    - commissioner
    - method
    - sample_size
    - sample_frame
    - field_start
    - field_end
    - publish_date
    - moe
    - moe_applicable
    - undecided
  rules:
    - 不得将不同机构民调连成趋势。
    - 电话调查与封闭网络调查不得直接计算升降。
    - moe_applicable=false 时不得套用传统随机抽样误差。
    - 未决定比例超过 15% 时必须单独指出。

data_readiness:
  statuses: [ready, partial, insufficient]
  hard_required: 缺失则不得进行完整结构分析。
  conditional: 发现残差后才需要。
  optional: 缺失仍可分析，但必须说明限制。
  output_fields:
    - status
    - required
    - available
    - missing
    - stale
    - warnings


live_campaign_state:
  storage: cache/campaign_state/
  required_for_online_current_cycle_analysis: true
  windows_days: [7, 14, 30]
  required_outputs:
    - as_of
    - campaign_change_trigger
    - campaign_change_reasons
    - snapshot_delta
    - same_series_poll_changes
    - retrieval_lead_count
  trigger_semantics: >
    trigger 只表示需要进一步研究，不代表某候选人受益、受损、领先或更可能当选。


campaign_state:
  required_in_online_mode: true
  as_of_required: true
  windows_days: [7, 14, 30]
  active_inputs:
    - current_candidates
    - current_events
    - resolved_campaign_events
    - current_local_relationships
    - polls
    - retrieval_leads
  trigger_conditions:
    - verified_recent_campaign_event
    - corroborated_recent_campaign_event
    - candidate_field_change
    - same_series_poll_change
    - new_event_since_previous_snapshot
  rule: >
    触发只表示需要进一步研究，不表示事件已经改变胜负格局，也不得据此输出候选人排名、
    胜率或结果预测。

campaign_event_resolution:
  schema: schemas/campaign_event.yaml
  runtime: runtime/campaign_event.py
  input_order:
    - retrieval_lead
    - article_body
    - evidence_excerpt
    - entity_resolution
    - cross_source_clustering
    - campaign_event
  rules:
    - 只有 body_status=read 且存在正文的 lead 才可进入事件解析。
    - 候选人实体优先依据当前官方候选人清单进行精确映射，不得从模型记忆补全。
    - page_date 或 first_seen_at 仅作为媒体报道日期代理；不得伪装成已核实事件发生时间。
    - single_source_media 只进入上下文，不触发结构研究。
    - corroborated_media 至少两个独立来源，可触发进一步研究与 Snapshot Delta，但不得自动形成结构性结论。
    - verified/confirmed 仍必须遵守既有 A/B/C 来源等级和验证规则。
