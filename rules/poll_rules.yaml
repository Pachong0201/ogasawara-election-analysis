version: 1.4.0
name: poll_rules
position: after_historical_structure_and_local_knowledge
purpose: >
  民调用于检验当前状态是否偏离历史结构，而不是替代历史结构，
  也不是单独预测胜负。

required_metadata:
  - pollster
  - commissioner
  - method
  - sample_size
  - sample_frame
  - field_start
  - field_end
  - publish_date
  - moe
  - moe_applicable
  - undecided
  - weighting
  - question_wording
  - cross_tabs_available

rules:
  - id: POLL-01
    statement: 不同调查机构的数据不得直接连成趋势线。
    enforcement: >
      若需比较，必须说明机构、方法、题目、加权与样本差异，
      并将差异列为可能解释，而不是画出连续趋势线。
  - id: POLL-02
    statement: 电话调查与封闭式网络调查不得直接计算“上涨／下降”。
    enforcement: >
      不同调查模式只能并列呈现，并标注不可直接比较。
  - id: POLL-03
    statement: 阵营内部民调没有公开方法时，只能记录为 campaign_claim。
    enforcement: >
      不得写入事实库，不得作为结构性判断证据。
  - id: POLL-04
    statement: >
      如果调查机构没有提供候选人差值的标准误、区间估计或统计显著性检验，
      不应仅凭点估计宣称统计上存在明确差距。
    output_expression: >
      点估计存在差异，但调查资料不足以确认该差异具有统计上的明确区分意义。
    enforcement: >
      不得仅凭点估计写成明确领先、落后或趋势变化；
      若差距落在已提供的抽样误差范围内，应写“数据没有显示可以明确区分的差距”。
  - id: POLL-05
    statement: 未决定比例超过 15% 时，必须单独指出。
    enforcement: >
      同时说明未决定比例的统计基础与可能影响，不得把它平均分配给候选人。
  - id: POLL-06
    statement: 地区或年龄交叉样本较小时，不得过度解释。
    enforcement: >
      样本数小于 100 或未公开样本数时，只可作为待验证线索。
  - id: POLL-07
    statement: 民调作用是检验当前状态是否偏离历史结构。
    enforcement: >
      不得以民调替代历史基准；民调与结构冲突时，先检查调查方法和结构资料。
  - id: POLL-08
    statement: moe_applicable=false 时不得套用传统随机抽样误差。
    enforcement: >
      封闭式网络调查等方法不得强制填写传统 moe 或据此宣称统计显著；
      可并列呈现点估计，并说明调查方法限制。

module_checks:
  before_use:
    - 检查 pollster、commissioner、method、sample_size、sample_frame、field_start、field_end、moe、moe_applicable、undecided 是否齐全。
    - 若 moe_applicable=false，不得套用传统随机抽样误差。
    - 检查是否为阵营内部民调且未公开方法；若是，标记 campaign_claim。
    - 检查题目措辞是否与历史民调一致。
    - 检查调查期间是否有重大事件影响。
    - 检查未决定比例是否超过 15%。
  on_conflict:
    - 先检查调查方法、样本、加权与题目差异。
    - 检查历史结构是否因候选人结构变化而不再适用。
    - 不得直接以最新民调推翻长期结构，也不得直接以历史结构否定民调。
  output:
    - 明确民调只能验证或偏离当前结构。
    - 列出方法与交叉表限制。
    - 不与不同机构数据连成趋势线。
    - 输出不确定性。

banned_expressions:
  - 不同机构民调直接连线
  - 从网络民调直接推导电话民调趋势
  - 封闭网络调查套用传统随机抽样误差
  - 未决定票按比例平均分配给候选人
  - 单一民调决定胜负
  - 以民调直接换算县市长票或立委票


  - id: POLL-09
    statement: 同一调查系列在方法口径稳定时，可以描述跨期点估计变化。
    enforcement: >
      只有 pollster、commissioner、method、sample_frame 与 question_wording
      一致时，才可计算 same-series delta；必须同时保留调查期、未决定比例、
      样本与误差限制。该 delta 只用于识别当前状态变化，不得写成胜负趋势，
      也不得据此自行判断统计显著。
  - id: POLL-10
    statement: 不同调查系列仍不得拼接成单一走势。
    enforcement: >
      跨机构、跨方法或题目变化的数据只能并列用于结构校准；
      不得把 same-series 规则扩张为跨系列趋势线。
